name: Deploy to Cloudflare Workers

# Deploys this Worker to Cloudflare. GitHub-hosted runners can reach
# api.cloudflare.com, so this works even when a local machine / sandbox cannot.
#
# Token resolution order:
#   1. repository secret CLOUDFLARE_API_TOKEN (recommended, persists)
#   2. the cf_api_token input when the workflow is started manually
#
# Optional secret CLOUDFLARE_ACCOUNT_ID: if unset, the Account ID is discovered
# from the token.

on:
  workflow_dispatch:
    inputs:
      cf_api_token:
        description: "Cloudflare API token (only if the CLOUDFLARE_API_TOKEN secret is not set)"
        required: false
        default: ""
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || inputs.cf_api_token }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare token
        run: |
          set -u
          if [ -z "${CF_TOKEN:-}" ]; then
            echo "::error::No Cloudflare token. Add the CLOUDFLARE_API_TOKEN repository secret (Settings -> Secrets and variables -> Actions), or pass cf_api_token when running this workflow manually."
            exit 1
          fi
          BODY=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$BODY"
          OK=$(printf '%s' "$BODY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).success===true))}catch(e){process.stdout.write('false')}})")
          if [ "$OK" != "true" ]; then
            echo "::error::Cloudflare rejected the token. Create a token with the 'Workers Scripts: Edit' permission and try again."
            exit 1
          fi

      - name: Resolve Account ID
        run: |
          set -u
          if [ -n "${CLOUDFLARE_ACCOUNT_ID_SECRET:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID_SECRET" >> "$GITHUB_ENV"
            echo "Using CLOUDFLARE_ACCOUNT_ID secret."
            exit 0
          fi
          PICK="let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s).result||[];const r0=Array.isArray(r)?r[0]:r;const id=(r0&&(r0.id||(r0.account&&r0.account.id)))||'';process.stdout.write(id)}catch(e){process.stdout.write('')}})"
          ID=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e "$PICK")
          if [ -z "$ID" ]; then
            ID=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/memberships | node -e "$PICK")
          fi
          if [ -z "$ID" ]; then
            echo "::error::Could not discover the Account ID. Add the CLOUDFLARE_ACCOUNT_ID secret (Cloudflare Dashboard -> Workers & Pages -> Account ID in the sidebar)."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          echo "Discovered Account ID: $ID"
        env:
          CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: |
          set -o pipefail
          npx -y wrangler@4 whoami 2>&1 | tee /tmp/whoami.log
          npx -y wrangler@4 deploy 2>&1 | tee /tmp/deploy.log

      - name: Report deployment URL
        if: always()
        run: |
          set -u
          URL=""
          if [ -f /tmp/deploy.log ]; then
            URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev[^[:space:]]*' /tmp/deploy.log | head -n1 || true)
          fi
          if [ -n "$URL" ]; then
            echo "Worker URL: $URL"
            echo "### Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
            echo "HTTP status: $(curl -s -o /dev/null -w '%{http_code}' -m 20 "$URL" || echo 'no response')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deploy output contained no workers.dev URL" >> "$GITHUB_STEP_SUMMARY"
          fi
