name: Deploy to Cloudflare Workers

# Deploy this Worker via GitHub Actions (the sandbox / local machine may not be
# able to reach api.cloudflare.com, but GitHub-hosted runners can).
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN    - Cloudflare API token with Workers deploy rights
# Optional repository secret:
#   CLOUDFLARE_ACCOUNT_ID   - Account ID; if unset it is auto-discovered.
#
# Trigger manually: Actions -> "Deploy to Cloudflare Workers" -> Run workflow
# Or automatically on every push.

on:
  workflow_dispatch:
    inputs:
      cf_api_token:
        description: "Optional: Cloudflare API token (use only if the CLOUDFLARE_API_TOKEN secret is not set; never commit it)"
        required: false
        default: ""
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare token & discover Account ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || inputs.cf_api_token }}
          CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it in Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

          echo "Verifying token..."
          VERIFY=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$VERIFY"
          if ! echo "$VERIFY" | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::Cloudflare rejected the token (see the response above). Create a new token with the 'Workers Scripts: Edit' permission."
            exit 1
          fi

          if [ -n "${CLOUDFLARE_ACCOUNT_ID_SECRET:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID_SECRET" >> "$GITHUB_ENV"
            echo "Using Account ID from secret."
            exit 0
          fi

          echo "Discovering Account ID from token..."
          get_first_id() {
            python3 -c "import sys,json
try:
    d=json.load(sys.stdin)
except Exception:
    print(''); raise SystemExit
r=d.get('result') or []
print(r[0]['id'] if isinstance(r,list) and r and isinstance(r[0],dict) and 'id' in r[0] else '')"
          }

          ACCOUNT_ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts | get_first_id)
          if [ -z "$ACCOUNT_ID" ]; then
            ACCOUNT_ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/memberships | get_first_id)
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Could not discover the Account ID from this token. Either grant the token account-level access, or add the CLOUDFLARE_ACCOUNT_ID secret (Cloudflare Dashboard -> Workers & Pages -> Account ID in the right sidebar)."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Discovered Account ID: $ACCOUNT_ID"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || inputs.cf_api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx -y wrangler@4 whoami 2>&1 | tee /tmp/whoami.log
          npx -y wrangler@4 deploy 2>&1 | tee /tmp/deploy.log

      - name: Report deployment URL
        if: always()
        run: |
          set -u
          URL=""
          if [ -f /tmp/deploy.log ]; then
            URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev[^[:space:]]*' /tmp/deploy.log | head -n1 || true)
          fi
          if [ -n "$URL" ]; then
            echo "### ✅ Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Worker URL: $URL"
            echo "Smoke test (HTTP status): $(curl -s -o /dev/null -w '%{http_code}' -m 20 "$URL" || echo 'no response')"
          else
            echo "### ⚠️ Deploy output contained no workers.dev URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the 'Deploy to Cloudflare Workers' step log above."
          fi
