name: Deploy to Cloudflare Workers

# Deploy this Worker via GitHub Actions (the sandbox / local machine may not
# be able to reach api.cloudflare.com, but GitHub-hosted runners can).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN    - Cloudflare API token with Workers deploy rights
#   CLOUDFLARE_ACCOUNT_ID   - (optional) Account ID; if unset it is
#                             auto-discovered from the token via the API.
#
# Trigger manually: Actions -> "Deploy to Cloudflare Workers" -> Run workflow
# Or automatically on every push.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare token & discover Account ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Verifying token..."
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify
          echo ""
          if [ -n "$CLOUDFLARE_ACCOUNT_ID_SECRET" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID_SECRET" >> "$GITHUB_ENV"
            echo "Using Account ID from secret."
          else
            echo "Discovering Account ID from token..."
            ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/accounts | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('success') and d.get('result') else '')")
            if [ -z "$ACCOUNT_ID" ]; then
              echo "::error::Could not discover Account ID from token. Check token permissions (Account: Workers Scripts Edit / Workers KV, etc.) or set the CLOUDFLARE_ACCOUNT_ID secret manually (Cloudflare Dashboard -> Workers & Pages -> Account ID on the right)."
              exit 1
            fi
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
            echo "Discovered Account ID."
          fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y wrangler@4 whoami
          npx -y wrangler@4 deploy
