name: Deploy to Cloudflare Workers

# Deploys this Worker to Cloudflare. GitHub-hosted runners can reach
# api.cloudflare.com, so this works even when a local machine / sandbox cannot.
#
# Token resolution order:
#   1. repository secret CLOUDFLARE_API_TOKEN (recommended, persists)
#   2. the cf_api_token input when the workflow is started manually
#
# Optional secret CLOUDFLARE_ACCOUNT_ID: if unset, the Account ID is discovered
# from the token.

on:
  workflow_dispatch:
    inputs:
      cf_api_token:
        description: "Cloudflare API token (only if the CLOUDFLARE_API_TOKEN secret is not set)"
        required: false
        default: ""
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || inputs.cf_api_token }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Cloudflare token
        run: |
          set -u
          if [ -z "${CF_TOKEN:-}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::No Cloudflare token. Add the CLOUDFLARE_API_TOKEN repository secret (Settings -> Secrets and variables -> Actions), or pass cf_api_token when running this workflow manually."
              exit 1
            fi
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed. Add the repository secret to enable automatic deploys."
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
          fi
          BODY=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "$BODY"
          OK=$(printf '%s' "$BODY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).success===true))}catch(e){process.stdout.write('false')}})")
          if [ "$OK" != "true" ]; then
            echo "::error::Cloudflare rejected the token. Create a token with the 'Workers Scripts: Edit' permission and try again."
            exit 1
          fi

      - name: Resolve Account ID
        if: env.SKIP_DEPLOY != 'true'
        run: |
          set -u
          if [ -n "${CLOUDFLARE_ACCOUNT_ID_SECRET:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID_SECRET" >> "$GITHUB_ENV"
            echo "Using CLOUDFLARE_ACCOUNT_ID secret."
            exit 0
          fi
          PICK="let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s).result||[];const r0=Array.isArray(r)?r[0]:r;const id=(r0&&(r0.id||(r0.account&&r0.account.id)))||'';process.stdout.write(id)}catch(e){process.stdout.write('')}})"
          ID=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts | node -e "$PICK")
          if [ -z "$ID" ]; then
            ID=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/memberships | node -e "$PICK")
          fi
          if [ -z "$ID" ]; then
            echo "::error::Could not discover the Account ID. Add the CLOUDFLARE_ACCOUNT_ID secret (Cloudflare Dashboard -> Workers & Pages -> Account ID in the sidebar)."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          echo "Discovered Account ID: $ID"
        env:
          CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        if: env.SKIP_DEPLOY != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || inputs.cf_api_token }}
        run: |
          npx -y wrangler@4 whoami > /tmp/whoami.log 2>&1 || true
          tail -n 20 /tmp/whoami.log
          if npx -y wrangler@4 deploy > /tmp/deploy.log 2>&1; then
            tail -n 40 /tmp/deploy.log
          else
            tail -n 60 /tmp/deploy.log
            MSG=$(tail -n 25 /tmp/deploy.log | tr '\n' '~' | tr -d '%\r')
            echo "::error title=wrangler deploy failed::$MSG"
            exit 1
          fi
          SUMMARY=$(grep -iE 'deployed|upload|workers\.dev|script' /tmp/deploy.log | tr '\n' '~' | tr -d '%\r' | cut -c1-800)
          echo "::notice title=wrangler deploy output::$SUMMARY"

      - name: Verify deployment
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || inputs.cf_api_token }}
        run: |
          set +e
          URL=""
          if [ -f /tmp/deploy.log ]; then
            URL=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev[^[:space:]]*' /tmp/deploy.log | head -n1)
          fi
          if [ -z "$URL" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            SUB=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).result.subdomain||'')}catch(e){process.stdout.write('')}})")
            [ -n "$SUB" ] && URL="https://edcloudwasm.$SUB.workers.dev"
          fi
          [ -z "$URL" ] && URL="https://edcloudwasm.gavimovado.workers.dev"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -m 25 "$URL")
          echo "### Worker URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "GET / -> HTTP $STATUS (404 is expected: this Worker only serves WebSocket and gRPC traffic)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Worker URL::$URL (HTTP $STATUS on /, expected 404)"

      - name: End-to-end VLESS tunnel test
        id: tunnel
        if: always() && env.SKIP_DEPLOY != 'true'
        continue-on-error: true
        run: |
          set +e
          WORKER_URL="https://edcloudwasm.gavimovado.workers.dev"
          UUID_VALUE=$(node -e "const s=require('fs').readFileSync('wrangler.toml','utf8');const m=s.match(/^UUID\s*=\s*\"([^\"]+)\"/m);process.stdout.write(m?m[1]:'')")
          echo "Testing $WORKER_URL with UUID $UUID_VALUE"
          run_case() {
            local label="$1" host="$2" port="$3"
            if node .github/scripts/vless-smoke-test.mjs "$WORKER_URL" "$UUID_VALUE" "$host" "$port" > "/tmp/e2e-${label}.log" 2>&1; then
              sed 's/^/  /' "/tmp/e2e-${label}.log"
              echo "::notice title=Tunnel OK ($label)::VLESS over WebSocket via $WORKER_URL reached $host:$port"
              echo "- ✅ $label ($host:$port): tunnel OK" >> "$GITHUB_STEP_SUMMARY"
            else
              sed 's/^/  /' "/tmp/e2e-${label}.log"
              MSG=$(tr '\n' '~' < "/tmp/e2e-${label}.log" | cut -c1-400)
              echo "::warning title=Tunnel failed ($label)::$MSG"
              echo "- ❌ $label ($host:$port): failed" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          # Domain target exercises the Worker's own DoH resolution path
          run_case "domain" cp.cloudflare.com 80
          # Raw IPv4 target exercises direct connect without DNS
          run_case "ipv4" 1.1.1.1 80
          # HTTPS target exercises the TLS path
          run_case "https" cloudflare.com 443

      - name: End-to-end xHTTP (gRPC POST) tunnel test
        id: xhttp
        if: always() && env.SKIP_DEPLOY != 'true'
        continue-on-error: true
        run: |
          set +e
          WORKER_URL="https://edcloudwasm.gavimovado.workers.dev"
          UUID_VALUE=$(node -e "const s=require('fs').readFileSync('wrangler.toml','utf8');const m=s.match(/^UUID\s*=\s*\"([^\"]+)\"/m);process.stdout.write(m?m[1]:'')")
          # The tunnel request is plaintext HTTP to port 80, but it asks the Worker
          # to connect to example.com:443 (TLS target) via VLESS_PORT.
          if VLESS_PORT=443 node .github/scripts/xhttp-smoke-test.mjs "$WORKER_URL" "$UUID_VALUE" example.com 80 > /tmp/xhttp.log 2>&1; then
            sed 's/^/  /' /tmp/xhttp.log
            echo "::notice title=xHTTP tunnel OK::gRPC POST through $WORKER_URL reached the internet"
            echo "- ✅ xHTTP (gRPC POST): tunnel OK" >> "$GITHUB_STEP_SUMMARY"
          else
            sed 's/^/  /' /tmp/xhttp.log
            MSG=$(tr '\n' '~' < /tmp/xhttp.log | cut -c1-400)
            echo "::warning title=xHTTP tunnel failed::$MSG"
            echo "- ❌ xHTTP (gRPC POST): failed" >> "$GITHUB_STEP_SUMMARY"
          fi
